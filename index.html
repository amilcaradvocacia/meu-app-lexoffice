<script id="lex-init-config">
// Auto-inicializa campos de integração com valores do localStorage
document.addEventListener('DOMContentLoaded', function() {
  function initField(id, key, fallback) {
    var el = document.getElementById(id);
    if (!el) return;
    var val = localStorage.getItem(key) || fallback || '';
    if (val) el.value = val;
  }
  // Campos da configuração central
  setTimeout(function() {
    initField('lexat_anthropic_key', 'lex_anthropic_key', '');
    initField('claude_api_key_card', 'lex_anthropic_key', '');
    initField('lexat_drive_id', 'lex_drive_clientes_id', '1xoBLeDu6LKNHHJO-q2pNU0WwxdrLJsnt');
    initField('lex_proxy_datajud', 'lex_datajud_proxy', 'https://lexoffice-datajud.amilcaradvocacia.workers.dev');
    initField('lexat_modelo', 'lex_claude_modelo', 'claude-sonnet-4-20250514');
    initField('claude_modelo', 'lex_claude_modelo', 'claude-sonnet-4-20250514');
    // Atualiza badge Claude
    var k = localStorage.getItem('lex_anthropic_key');
    var b = document.getElementById('badge-claude');
    if (k && b) { b.textContent = 'Ativo ✅'; b.className = 'badge bteal'; }
    // Atualiza badge DataJud
    var p = localStorage.getItem('lex_datajud_proxy');
    var bd = document.getElementById('badge-datajud');
    if (p && bd) { bd.textContent = 'Proxy Ativo ✅'; bd.className = 'badge bteal'; }
  }, 500);
});
</script>
  <script src="lexofficeat-enhancements.js"></script>

<script>
// LexOfficeAT — Dashboard Dinâmico v2.0
(function() {
  function renderPrazosDash() {
    var box = document.getElementById('dashPrazosConteudo');
    if (!box) return;
    if (typeof LexSync === 'undefined' || !LexSync.DB) {
      setTimeout(renderPrazosDash, 1000); return;
    }
    var hoje  = new Date();
    var prazos = (LexSync.DB.getAll(LexSync.DB.KEYS.prazos) || [])
      .filter(function(p) { return p.status === 'pendente'; })
      .map(function(p) {
        var vISO = p.vencimentoISO || (p.vencimento||'').split('/').reverse().join('-');
        var dias = Math.ceil((new Date(vISO) - hoje) / 86400000);
        return Object.assign({}, p, {diasRestantes: dias});
      })
      .sort(function(a,b) { return a.diasRestantes - b.diasRestantes; })
      .slice(0, 5);
    if (!prazos.length) {
      box.innerHTML = '<div style="color:var(--text3);font-size:13px;padding:10px 0">Nenhum prazo pendente</div>';
      return;
    }
    box.innerHTML = prazos.map(function(p) {
      var cor   = p.diasRestantes <= 2 ? 'var(--red)' : p.diasRestantes <= 5 ? 'var(--orange)' : 'var(--green)';
      var icone = p.diasRestantes <= 2 ? '⚠️' : p.diasRestantes <= 5 ? '⚡' : '✅';
      var pct   = Math.max(5, Math.min(100, (10 - p.diasRestantes) / 10 * 100));
      var cls   = p.diasRestantes <= 2 ? 'c' : p.diasRestantes <= 5 ? 'w' : 'g';
      var cli   = (p.cliente || p.cnj || '?').slice(0, 30);
      return '<div style="padding:8px 0;border-bottom:1px solid var(--border)">'
        + '<div style="font-size:12px;color:var(--text)">' + p.tipo + ' — ' + (p.cnj||'').slice(0,25) + '</div>'
        + '<div style="font-size:11px;color:' + cor + ';margin-top:2px">' + icone + ' Vence em ' + p.diasRestantes + ' dias · ' + cli + '</div>'
        + '<div class="pbar"><div class="pfill ' + cls + '" style="width:' + pct + '%"></div></div>'
        + '</div>';
    }).join('');
  }

  function renderPublicacoesDash() {
    // Atualiza badge de publicações na sidebar
    var badge = document.querySelector('[data-page="publicacoes"] .badge, a[onclick*="publicacoes"] .badge');
    if (badge && typeof LexSync !== 'undefined' && LexSync.DB) {
      var n = (LexSync.DB.getAll(LexSync.DB.KEYS.publicacoes)||[]).length;
      if (n > 0) badge.textContent = n;
    }
  }

  function renderKPIs() {
    if (typeof LexSync === 'undefined' || !LexSync.DB) return;
    var db = LexSync.DB;
    var prazos    = (db.getAll(db.KEYS.prazos)||[]).filter(function(p){return p.status==='pendente';});
    var pubs      = db.getAll(db.KEYS.publicacoes)||[];
    var processos = db.getAll(db.KEYS.processos)||[];

    // Atualiza badge prazos urgentes no dashboard
    var kpz = document.getElementById('kPrazosUrgentes');
    if (kpz) kpz.textContent = prazos.filter(function(p){return p.diasRestantes<=5;}).length || prazos.length;

    // Badge publicações na sidebar
    var spub = document.querySelector('.sidebar-pub-badge');
    if (spub) spub.textContent = pubs.length;
  }

  function init() {
    renderPrazosDash();
    renderPublicacoesDash();
    renderKPIs();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(init, 2000); });
  } else {
    setTimeout(init, 2000);
  }
  setInterval(init, 30000);

  // Re-executa ao navegar para o dashboard
  var origGo = window.go;
  if (origGo && !origGo._dashHooked) {
    window.go = function(page, el) {
      origGo(page, el);
      if (page === 'dashboard') setTimeout(init, 300);
    };
    window.go._dashHooked = true;
  }
})();
  

<script>
// LexOfficeAT — Dashboard Auto-Update
(function() {
  function atualizarDashboard() {
    try {
      // Prazos próximos
      var prazosList = document.getElementById('dashPrazos') || document.getElementById('prazosLista');
      if (prazosList && typeof LexSync !== 'undefined') {
        var prazos = LexSync.DB.getAll(LexSync.DB.KEYS.prazos) || [];
        var hoje = new Date();
        var proximos = prazos
          .filter(function(p) { return p.status === 'pendente'; })
          .sort(function(a,b) { return new Date(a.vencimentoISO||a.vencimento) - new Date(b.vencimentoISO||b.vencimento); })
          .slice(0, 10);
        if (proximos.length && prazosList) {
          prazosList.innerHTML = proximos.map(function(p) {
            var v = new Date(p.vencimentoISO || p.vencimento);
            var dias = Math.ceil((v - hoje) / 86400000);
            var cor = dias <= 1 ? 'var(--red)' : dias <= 3 ? 'var(--orange)' : 'var(--teal)';
            return '<div class="ditem" style="gap:8px">'
              + '<span style="color:'+cor+';font-weight:600;font-size:13px;min-width:30px">'+dias+'d</span>'
              + '<div><div style="font-size:12px">'+p.tipo+'</div>'
              + '<div style="font-size:11px;color:var(--text3)">'+(p.cliente||p.cnj||'')+'</div></div>'
              + '<span style="font-size:11px;color:var(--text3);margin-left:auto">'+p.vencimento+'</span>'
              + '</div>';
          }).join('');
        }
      }

      // Publicações recentes no dashboard
      var pubsEl = document.getElementById('dashPublicacoes') || document.getElementById('kPublicacoes');
      if (pubsEl && typeof LexSync !== 'undefined') {
        var pubs = LexSync.DB.getAll(LexSync.DB.KEYS.publicacoes) || [];
        if (pubsEl.tagName !== 'DIV') {
          pubsEl.textContent = pubs.length;
        } else if (pubs.length) {
          var recentes = pubs.slice(-5).reverse();
          pubsEl.innerHTML = recentes.map(function(p) {
            return '<div class="ditem" style="gap:8px">'
              + '<span class="badge '+(p.fonte==='jusbrasil'?'bo':'bteal')+'" style="font-size:10px">'+(p.fonte==='jusbrasil'?'JusBrasil':'Impacta')+'</span>'
              + '<div style="font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(p.cnj||p.movimento||'')+'</div>'
              + '</div>';
          }).join('');
        }
      }

      // KPIs — processos, prazos, publicações
      var kp = document.getElementById('kProcessos');
      var kpz = document.getElementById('kPrazos');
      var kpb = document.getElementById('kPublicacoes2');
      if (typeof LexSync !== 'undefined') {
        var procs = LexSync.DB.getAll(LexSync.DB.KEYS.processos) || [];
        var prazos2 = LexSync.DB.getAll(LexSync.DB.KEYS.prazos) || [];
        var pubs2 = LexSync.DB.getAll(LexSync.DB.KEYS.publicacoes) || [];
        if (kp) kp.textContent = procs.length + (typeof XLS2_DATA !== 'undefined' ? ' / ' + XLS2_DATA.length : '');
        if (kpz) kpz.textContent = prazos2.filter(function(p){return p.status==='pendente';}).length;
        if (kpb) kpb.textContent = pubs2.length;
      }
    } catch(e) {}
  }

  // Executa ao carregar e a cada 30 segundos
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { setTimeout(atualizarDashboard, 1500); });
  } else {
    setTimeout(atualizarDashboard, 1500);
  }
  setInterval(atualizarDashboard, 30000);

  // Também executa ao navegar para o dashboard
  window.addEventListener('hashchange', function() {
    if (location.hash === '#dashboard') setTimeout(atualizarDashboard, 300);
  });
})();
</script>
