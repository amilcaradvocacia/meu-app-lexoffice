<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexOffice 5.0 — Gestão Inteligente de Advocacia</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0c10;--surface:#111318;--surface2:#181c24;--surface3:#1e2330;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--gold:#c9a84c;--gold2:#e4c97a;--gdim:rgba(201,168,76,0.12);--gglow:rgba(201,168,76,0.25);--text:#f0ede8;--text2:#9fa6b4;--text3:#5c6270;--red:#e05c5c;--green:#4caf82;--blue:#5b8dee;--orange:#e8854a;--purple:#9b72e8;--teal:#3ecfcf;--r:12px;--rl:18px;}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;}
        .app{display:flex;height:100vh;}
        .sidebar{width:252px;min-width:252px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
        .logo-area{padding:22px 20px 14px;border-bottom:1px solid var(--border);}
        .logo-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--gold2);}
        .logo-sub{font-size:10px;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
        .vbadge{display:inline-block;background:var(--gdim);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:9px;font-family:'DM Mono',monospace;padding:2px 7px;border-radius:20px;margin-top:6px;letter-spacing:1px;}
        .user-area{padding:10px 12px;border-bottom:1px solid var(--border);}
        .user-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;}
        .user-btn{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12.5px;transition:all .18s;text-align:left;width:100%;margin-bottom:2px;}
        .user-btn:hover{background:var(--surface2);color:var(--text);}
        .user-btn.active{background:var(--gdim);border-color:rgba(201,168,76,.25);color:var(--gold2);}
        .avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;}
        nav{flex:1;}
        .nsec{padding:10px 10px 2px;}
        .nlabel{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:0 8px;margin-bottom:3px;}
        .nitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif;font-size:13px;transition:all .18s;width:100%;text-align:left;position:relative;}
        .nitem:hover{background:var(--surface2);color:var(--text);}
        .nitem.active{background:var(--gdim);color:var(--gold2);}
        .nitem.active::before{content:'';position:absolute;left:0;top:20%;height:60%;width:3px;background:var(--gold);border-radius:0 3px 3px 0;}
        .nico{font-size:15px;width:18px;text-align:center;flex-shrink:0;}
        .nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:10px;}
        .nbadge.w{background:var(--orange);}.nbadge.i{background:var(--blue);}.nbadge.t{background:var(--teal);color:#000;}
        .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
        .topbar{position:sticky;top:0;z-index:5;background:rgba(10,12,16,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;gap:12px;}
        .topbar h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;flex:1;}
        .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border:none;transition:all .18s;}
        .btn-gold{background:var(--gold);color:#0a0c10;}
        .btn-gold:hover{background:var(--gold2);transform:translateY(-1px);box-shadow:0 4px 14px var(--gglow);}
        .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border2);}
        .btn-ghost:hover{background:var(--surface2);color:var(--text);}
        .btn-ai{background:linear-gradient(135deg,rgba(91,141,238,.18),rgba(155,114,232,.18));color:#a8c4ff;border:1px solid rgba(91,141,238,.3);}
        .btn-ai:hover{background:linear-gradient(135deg,rgba(91,141,238,.28),rgba(155,114,232,.28));}
        .btn-teal{background:rgba(62,207,207,.13);color:var(--teal);border:1px solid rgba(62,207,207,.3);}
        .btn-teal:hover{background:rgba(62,207,207,.22);}
        .btn-red{background:rgba(224,92,92,.13);color:var(--red);border:1px solid rgba(224,92,92,.3);}
        .btn-sm{padding:6px 13px;font-size:12px;}
        .btn-xs{padding:4px 9px;font-size:11px;}
        .content{padding:22px 26px;flex:1;}
        .page{display:none;}
        .page.active{display:block;}
        .kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px;}
        .kcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:17px;position:relative;overflow:hidden;transition:all .2s;}
        .kcard:hover{border-color:var(--border2);transform:translateY(-2px);}
        .kcard.gold{color:var(--gold);}.kcard.green{color:var(--green);}.kcard.blue{color:var(--blue);}.kcard.red{color:var(--red);}
        .kico{font-size:20px;margin-bottom:9px;}
        .kval{font-family:'Playfair Display',serif;font-size:27px;font-weight:700;color:var(--text);line-height:1;}
        .klbl{font-size:11px;color:var(--text3);margin-top:3px;text-transform:uppercase;letter-spacing:.9px;}
        .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
        .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;}
        .ch{padding:14px 18px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
        .ct{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;}
        .cb{padding:16px 18px;}
        table{width:100%;border-collapse:collapse;}
        th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--text3);padding:0 0 8px;}
        td{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);vertical-align:middle;}
        .fg{margin-bottom:13px;}
        label{display:block;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-weight:500;}
        input,select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;transition:border .18s;}
        input:focus{border-color:var(--gold);}
        
        /* ITEM 1: ESTILO PARA CAMPOS AUTO-PREENCHIDOS */
        input.af{border-color:var(--teal)!important;background:rgba(62,207,207,.05)!important;}
        
        /* ITEM 2: CAIXA DE BUSCA CNJ NO MODAL */
        .cnj-box { background:rgba(62,207,207,.05); border:1px solid rgba(62,207,207,.2); border-radius:10px; padding:15px; margin-bottom:20px; display:flex; gap:10px; align-items:flex-end; }
        
        .moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.76);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;padding:18px;}
        .moverlay.open{display:flex;}
        .modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--rl);padding:26px;width:560px;max-width:95vw;max-height:90vh;overflow-y:auto;animation:mIn .22s ease;position:relative;}
        .modal-lg{width:820px;}
        @keyframes mIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
        .mtitle{font-family:'Playfair Display',serif;font-size:18px;margin-bottom:18px;}
        .mclose{position:absolute;right:16px;top:16px;background:none;border:none;color:var(--text3);cursor:pointer;font-size:18px;}
        .fr{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
        .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
        .bteal{background:rgba(62,207,207,.12);color:var(--teal);border:1px solid rgba(62,207,207,.3);}
        ::-webkit-scrollbar{width:4px;}
        ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:2px;}
    </style>
</head>
<body>

<div class="app">
    <aside class="sidebar">
        <div class="logo-area">
            <div class="logo-title">LexOffice</div>
            <div class="logo-sub">Gestão Jurídica IA</div>
            <div class="vbadge">v5.0</div>
        </div>
        <div class="user-area">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                <div class="user-label">Usuários</div>
            </div>
            <div id="sidebarUsers"></div>
        </div>
        <nav>
            <div class="nsec"><div class="nlabel">Principal</div>
                <button class="nitem active" onclick="go('dashboard',this)"><span class="nico">📊</span> Dashboard</button>
            </div>
            <div class="nsec"><div class="nlabel">Jurídico</div>
                <button class="nitem" onclick="go('processos',this)"><span class="nico">⚖️</span> Processos</button>
                <button class="nitem" onclick="go('clientes',this)"><span class="nico">👤</span> Clientes</button>
            </div>
        </nav>
    </aside>

    <main class="main">
        <div id="pg-dashboard" class="page active">
            <div class="topbar"><h1>Dashboard</h1><span id="greetUser" style="font-size:12px;color:var(--text3)"></span></div>
            <div class="content">
                <div class="kgrid">
                    <div class="kcard gold"><div class="kico">👤</div><div class="kval">4</div><div class="klbl">Clientes Ativos</div></div>
                    <div class="kcard blue"><div class="kico">⚖️</div><div class="kval">428</div><div class="klbl">Processos</div></div>
                </div>
                <button class="btn btn-gold" onclick="openModal('mProcesso')">＋ Novo Processo Inteligente</button>
            </div>
        </div>
        
        <div id="pg-processos" class="page">
            <div class="topbar"><h1>Processos</h1></div>
            <div class="content"><div class="card"><div class="cb">Tabela de processos carregada via XLS...</div></div></div>
        </div>
    </main>
</div>

<!-- MODAL DE PROCESSO COM ITEM 2 (BUSCA CNJ) -->
<div class="moverlay" id="mProcesso">
    <div class="modal modal-lg">
        <button class="mclose" onclick="closeModal('mProcesso')">✕</button>
        <div class="mtitle">⚖️ Processo Inteligente</div>
        
        <!-- ITEM 2: CAMPO DE BUSCA CNJ -->
        <div class="cnj-box">
            <div style="flex:1">
                <label style="color:var(--teal); font-weight:bold; font-size:10px;">⚡ BUSCA AUTOMÁTICA CNJ (API OFICIAL)</label>
                <input type="text" id="cnj_input_api" placeholder="0000000-00.0000.0.00.0000" style="border-color:var(--teal)">
            </div>
            <button class="btn btn-teal" onclick="consultarCNJ()" id="btn_consultar_api">🔍 Consultar CNJ</button>
        </div>

        <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px">
            <button id="tabDados" onclick="switchTab('dados')" style="padding:9px 18px;background:none;border:none;border-bottom:2px solid var(--gold);color:var(--gold);font-size:13px;font-weight:600;cursor:pointer">📋 Dados</button>
            <button id="tabPartes" onclick="switchTab('partes')" style="padding:9px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:13px;cursor:pointer">👥 Partes</button>
        </div>

        <div id="tabContentDados">
            <div class="fr">
                <div class="fg"><label>Ficha / Nº Processo</label><input id="f_proc" type="text"></div>
                <div class="fg"><label>Tipo de Ação</label><input id="f_acao" type="text"></div>
            </div>
            <div class="fr">
                <div class="fg"><label>Vara / Juízo</label><input id="f_vara" type="text"></div>
                <div class="fg"><label>Comarca</label><input id="f_comarca" type="text"></div>
            </div>
        </div>

        <div id="tabContentPartes" style="display:none">
            <div class="fr">
                <div class="fg"><label>Nome do Cliente</label><input id="f_parte1" type="text"></div>
                <div class="fg"><label>Polo</label><select id="f_polo"><option>AUTOR</option><option>RÉU</option></select></div>
            </div>
            <div class="fg"><label>Parte Adversa</label><input id="f_exadv" type="text"></div>
        </div>

        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
            <button class="btn btn-ghost" onclick="closeModal('mProcesso')">Cancelar</button>
            <button class="btn btn-gold" onclick="salvarProcesso()">💾 Salvar no Sistema</button>
        </div>
    </div>
</div>

<script>
// BASE DO SISTEMA
var S = { uidAtivo: 1, usuarios: [{id:1,nome:'Dr. Amilcar Cordeiro Teixeira Filho',cor:'#c9a84c',perfil:'advogado'}] };

function go(page,el){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('pg-'+page).classList.add('active');
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

function switchTab(tab) {
    document.getElementById('tabContentDados').style.display = tab==='dados'?'block':'none';
    document.getElementById('tabContentPartes').style.display = tab==='partes'?'block':'none';
    document.getElementById('tabDados').style.borderBottomColor = tab==='dados'?'var(--gold)':'transparent';
    document.getElementById('tabPartes').style.borderBottomColor = tab==='partes'?'var(--gold)':'transparent';
}

function toast(msg, cor) {
    var c = cor === 'teal' ? 'var(--teal)' : 'var(--gold)';
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:22px;right:22px;background:var(--surface);border:1px solid '+c+';color:'+c+';padding:11px 18px;border-radius:10px;font-size:13px;z-index:9999;';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 3000);
}

// ITEM 3: LÓGICA DE BUSCA CNJ (API CNJ)
async function consultarCNJ() {
    const cnj = document.getElementById('cnj_input_api').value.trim();
    const btn = document.getElementById('btn_consultar_api');

    if (cnj.length < 15) {
        toast('⚠️ Informe um número CNJ válido', 'gold');
        return;
    }

    btn.innerHTML = '⏳ Acessando CNJ...';
    btn.disabled = true;

    try {
        // SIMULAÇÃO DA RESPOSTA DA BIBLIOTECA busca-processos-judiciais
        setTimeout(() => {
            const data = {
                numero: cnj,
                classe: "Procedimento Comum Cível",
                vara: "2ª Vara Cível",
                comarca: "Ponta Grossa/PR",
                autor: "AMÍLCAR CORDEIRO TEIXEIRA FILHO",
                reu: "BANCO EXEMPLO S/A"
            };

            // Preenchimento dos campos
            document.getElementById('f_proc').value = data.numero;
            document.getElementById('f_acao').value = data.classe;
            document.getElementById('f_vara').value = data.vara;
            document.getElementById('f_comarca').value = data.comarca;
            document.getElementById('f_parte1').value = data.autor;
            document.getElementById('f_exadv').value = data.reu;

            // ITEM 1: APLICAR ESTILO DE DESTAQUE NOS CAMPOS PREENCHIDOS
            ['f_proc','f_acao','f_vara','f_comarca','f_parte1','f_exadv'].forEach(id => {
                const el = document.getElementById(id);
                if(el && el.value) el.classList.add('af');
            });

            btn.innerHTML = '🔍 Consultar CNJ';
            btn.disabled = false;
            toast('✅ Dados capturados com sucesso!', 'teal');
            switchTab('dados');
        }, 1500);

    } catch (e) {
        toast('❌ Erro na consulta', 'red');
        btn.disabled = false;
    }
}

function salvarProcesso(){
    toast('✅ Processo salvo com sucesso!', 'teal');
    closeModal('mProcesso');
}

// Inicia sidebar
(function init(){
    document.getElementById('sidebarUsers').innerHTML = `<button class="user-btn active"><div class="avatar" style="background:${S.usuarios[0].cor}22;color:${S.usuarios[0].cor}">AC</div><div>${S.usuarios[0].nome}</div></button>`;
})();
</script>
</body>
</html>
